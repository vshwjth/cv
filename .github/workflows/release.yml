name: Build and release resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile resume
        run: typst compile --ignore-system-fonts --font-path fonts resume.typ resume.pdf

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_time="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="$(date -u -d "@${commit_time}" +"%Y-%m-%dT%H:%M:%SZ")"
          tag="resume-${version//:/-}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" resume.pdf --clobber
          else
            gh release create "$tag" resume.pdf \
              --target "$GITHUB_SHA" \
              --title "Resume ${version}" \
              --notes "Automatically generated from commit ${GITHUB_SHA}."
          fi
